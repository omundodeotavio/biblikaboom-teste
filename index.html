/* ---------- Partida ---------- */
function iniciar(){
  limpar();camada.innerHTML="";J=novoJogo(PREF.modo,PREF.nivel);J.rival=sortearRivais(1)[0];ULT=null;DES=null;
  J.cartas.forEach(c=>{const i=new Image();i.src=img(c)});
  fimEm=PREF.tempo!=="0"?Date.now()+Number(PREF.tempo)*60000:null;
  if(fimEm)relogio=setInterval(()=>{const el=$("#relogio");if(el)el.textContent=restante();
    if(Date.now()>=fimEm&&(F==="escolher"||F==="robo"))terminar(fimPorTempo(J),true)},500);
  if(typeof TUT!=="undefined"&&TUT.on)tutPreparar(J);
  topo();SOM.embaralhar();SOM.volumeMusica(.28);depois(420,rodada);
}
function restante(){if(!fimEm)return "";const s=Math.max(0,Math.ceil((fimEm-Date.now())/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function slot(c,{aberta=true,escolher=false,alvo=null,dono,estado="",qtd=0,dica=false,chega=false}){
  const alvos=c?ATRIBUTOS.map(a=>{
    const top=(LINHA_Y[a.k]*100-3.3).toFixed(1)+"%";
    if(escolher)return `<button type="button" class="alvo pode" id="atr-${a.k}" data-atr="${a.k}" style="top:${top}" aria-label="Escolher ${a.r}: ${a.k==="p"?c.p+"º":fmt(c[a.k])}"></button>`;
    if(alvo===a.k)return `<span class="alvo marcado" style="top:${top}"></span>`;
    return "";}).join(""):"";
  return `<div class="slot ${estado}">${qtd>1?'<div class="pilha p2"></div>':""}${qtd>0?'<div class="pilha p1"></div>':""}
    <div class="giro ${chega?(dono==="R"?"chega-r":"chega"):""}" ${dono==="P"?"data-tilt":""}><div class="interno${aberta?"":" fechada"}">
      <div class="face">${c?`<img class="carta-img" src="${img(c)}" alt="Carta ${esc(c.n)}"><span class="brilho"></span>`+alvos:""}</div><div class="face costas"></div>
    </div></div>${dica?'<img class="mao-dica" src="arte/mao-apontando.webp" alt="">':""}</div>`;
}
function poderHTML(c,dono){
  if(!c||!ehBkb(J,c))return "";
  const gasto=J.usado[dono].has(c.n);
  return `<span class="poder${gasto?" gasto":""}">${gasto?"Poder Biblikaboom usado":"Carta Biblikaboom: poder pronto"}</span>`;
}
function mesa({p,r,aberta,escolher=false,alvo=null,estP="",estR="",m1="",cls="",m2="",botao="",mostrarPoderR=false,chega=false}){
  const v=VISUAL[J.modo],m=MODOS[J.modo];
  tela.innerHTML=`<div class="miolo jogo">
  <div class="barra">
    <div class="emblema" style="--fundo:${v.fundo};--cor:${v.cor}"><span class="disco ic"><img src="arte/ic/${J.modo}.webp" alt=""></span><b>${m.nome}</b></div>
    <div class="placar">
      <span class="pl" style="--c:var(--ouro)"><i></i>${typeof PERFIL!=="undefined"&&PERFIL.nome?esc(PERFIL.nome):"Você"} <b>${J.P.length}</b></span>
      <span class="pl" style="--c:var(--lilas)"><i></i>${RN()} <b>${J.R.length}</b></span>
      ${J.pote.length?`<span class="pl" style="--c:#fff"><i></i>Mesa <b>${J.pote.length}</b></span>`:""}
      ${fimEm?`<span class="pl" style="padding-left:12px">Tempo <b id="relogio">${restante()}</b></span>`:""}
      <button type="button" class="sair" id="sair"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>Sair</button>
    </div>
  </div>
  <div class="msg-linha">${escolher?`<div class="sup-rel" id="r-rel" role="timer" aria-label="Tempo para escolher"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="trilho"/><circle cx="22" cy="22" r="19" class="arco"/></svg><b>${SEG_NIVEL[PREF.nivel]||40}</b><span>seg</span></div>`:""}<div class="mensagem" aria-live="polite"><div class="m1 ${cls}">${m1}</div><div class="m2">${m2}</div></div></div>
  <div class="mesa">
    <div class="lado"><div class="quem">${typeof PERFIL!=="undefined"&&PERFIL.nome?`<span class="av av-foto" style="--c:var(--ouro)"><img src="${omdoSrc(PERFIL.av)}" alt=""></span>${esc(PERFIL.nome)}`:`<span class="av" style="--c:var(--ouro)">${ICONE_VOCE}</span>Você`}</div>
      ${slot(p,{escolher,alvo,dono:"P",estado:estP,qtd:J.P.length-1,dica:escolher,chega})}${poderHTML(p,"P")}</div>
    <div class="vs" aria-hidden="true">VS</div>
    <div class="lado"><div class="quem"><span class="av av-foto" style="--c:var(--lilas)"><img src="${J.rival.src||avatarSrc(J.rival.a)}" alt=""></span>${RN()}</div>
      ${slot(r,{aberta,alvo,dono:"R",estado:estR,qtd:J.R.length-1,chega})}${mostrarPoderR?poderHTML(r,"R"):""}</div>
  </div>
  <div class="comando">${botao}</div>
  <p class="dica-baixo">${escolher?"Toque na linha da sua carta que você acha mais forte.":"&nbsp;"}</p>
  <p class="tv-dica">${escolher?"Controle: setas para escolher a linha e OK para confirmar. Ou as teclas 1 a 5.":"Controle: OK para continuar."}</p>
  </div>`;
}
/* ---------- tempo de cada rodada (Mega, Origem, Revelação) ---------- */
const SEG_NIVEL={facil:60,medio:40,dificil:20};
let RODADA_SEG=40;
let rodTimer=null,rodFim=0,rodUlt=0,rodTickAnt=0;
function rodRelIniciar(){rodRelParar();RODADA_SEG=SEG_NIVEL[PREF.nivel]||40;rodFim=performance.now()+RODADA_SEG*1000;rodUlt=RODADA_SEG+1;rodTickAnt=performance.now();rodTimer=setInterval(rodTick,100);rodTick()}
function rodRelParar(){if(rodTimer)clearInterval(rodTimer);rodTimer=null}
function rodTick(){
  if(F!=="escolher"){rodRelParar();return}
  const agora=performance.now();if(document.querySelector(".confirma")){rodFim+=agora-rodTickAnt;rodTickAnt=agora;return}rodTickAnt=agora;
  const rest=Math.max(0,rodFim-agora),seg=Math.ceil(rest/1000),r=$("#r-rel");
  if(r){r.style.setProperty("--p",(rest/(RODADA_SEG*1000)).toFixed(3));r.querySelector("b").textContent=seg;r.classList.toggle("urgente",seg<=3)}
  if(seg!==rodUlt){rodUlt=seg;if(seg<=3&&seg>0)SOM.tic()}
  if(rest<=0){rodRelParar();const al=[...document.querySelectorAll(".alvo.pode")];if(!al.length)return;
    const k=al[Math.floor(Math.random()*al.length)].dataset.atr;J.tempoAcabou=true;SOM.perdeu();revelar(k)}
}
function rodada(){
  if(!J.R.length)return terminar("P");
  if(!J.P.length)return terminar("R");
  if(fimEm&&Date.now()>=fimEm)return terminar(fimPorTempo(J),true);
  const p=J.P[0],r=J.R[0];
  if(J.vez==="P"){
    F="escolher";
    const bkb=ehBkb(J,p)&&!J.usado.P.has(p.n);
    SOM.distribuir();
    mesa({p,r,aberta:false,escolher:true,chega:true,m1:"Sua vez!",m2:bkb?"Sua carta é Biblikaboom: se precisar, ela vence esta rodada.":"Escolha um item da sua carta."});
    if(TUT.on)setTimeout(()=>{if(F==="escolher")tutVezSua()},750);else rodRelIniciar();
    if(!temMouse)requestAnimationFrame(()=>{const a=$(".alvo.pode");if(a&&matchMedia("(min-width:1600px)").matches)a.focus({preventScroll:true})});
  }else{
    F="robo";
    SOM.distribuir();
    mesa({p,r,aberta:false,chega:true,m1:`<span class="pensando">${RN()} está pensando</span>`,m2:"Enquanto isso, confira a sua carta."});
    if(TUT.on)tutVezDele();
    depois(1300,()=>{if(F!=="robo")return;const k=roboEscolhe(J);SOM.escolher();
      mesa({p,r,aberta:false,alvo:k,m1:RN()+" escolheu: "+ATR[k].r,m2:ATR[k].menor?"Vence a menor posição na Bíblia.":"Vence o maior valor."});
      depois(1200,()=>{if(F==="robo")revelar(k)});});
  }
}
function revelar(k){
  rodRelParar();F="revelado";const R=resolver(J,k);ULT=R;
  const v=x=>k==="p"?x.p+"º":fmt(x[k]);
  let m1,cls,m2=`${ATR[k].r}: você ${v(R.cp)} × ${RN()} ${v(R.cr)}`;
  if(J.tempoAcabou){m2="Tempo esgotado, sorteamos um item. "+m2;J.tempoAcabou=false}
  if(R.pUsa&&R.rUsa){m1="Duplo Biblikaboom!";cls="empate";m2="As duas cartas usaram o poder. Vai para o desempate."}
  else if(R.pUsa){m1="Biblikaboom! Você venceu";cls="ganhou";m2="Sua carta Biblikaboom venceu a rodada. Esse poder já foi usado."}
  else if(R.rUsa){m1="Biblikaboom de "+RN()+"!";cls="perdeu";m2="A carta Biblikaboom de "+RN()+" venceu a rodada."}
  else if(R.res===1){m1="Você venceu a rodada!";cls="ganhou"}
  else if(R.res===-1){m1=RN()+" venceu a rodada";cls="perdeu"}
  else{m1="Empate!";cls="empate";m2+=". A próxima carta decide."}
  mesa({p:R.cp,r:R.cr,aberta:false,alvo:k,estP:R.res===1?"vence":R.res===-1?"perde":"",estR:R.res===-1?"vence":R.res===1?"perde":"",m1,cls,m2,mostrarPoderR:true,
    botao:`<button type="button" class="botao" id="continuar">${R.res===0?"Desempatar":"Continuar"}</button>`});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const i=document.querySelectorAll(".interno")[1];if(i)i.classList.remove("fechada")}));
  SOM.virar();
  if(R.pUsa||R.rUsa)boom();else depois(380,()=>{cls==="ganhou"?SOM.ganhou():cls==="perdeu"?SOM.perdeu():SOM.empate()});
  $("#continuar").focus({preventScroll:true});
  if(TUT.on)tutRevelado(R,k);
}
function continuar(){
  if(F==="revelado"){
    const quem=recolher(J,ULT.res);
    if(quem)return rodada();
    if(!J.P.length||!J.R.length){desempatar(J);return rodada()}
    F="desempate";DES=desempatar(J);const g=DES.quem==="P";SOM.virar();depois(380,()=>{g?SOM.ganhou():SOM.perdeu()});
    mesa({p:DES.dp,r:DES.dr,aberta:true,alvo:"p",estP:g?"vence":"perde",estR:g?"perde":"vence",
      m1:g?"Desempate: você levou tudo!":"Desempate: "+RN()+" levou tudo",cls:g?"ganhou":"perdeu",
      m2:`Posição na Bíblia: você ${DES.dp.p}º × ${RN()} ${DES.dr.p}º. Quem vence leva as 4 cartas.`,
      botao:`<button type="button" class="botao" id="continuar">Continuar</button>`});
    $("#continuar").focus({preventScroll:true});return;
  }
  if(F==="desempate")rodada();
}
function boom(){SOM.boom();camada.innerHTML=`<div class="boom" aria-hidden="true">${logo()}</div>`;depois(1800,()=>{if(F!=="fim"&&F!=="sup-fim")camada.innerHTML=""})}
function terminar(quem,porTempo=false){
  limpar();F="fim";const g=quem==="P";
  const voceSrc=typeof PERFIL!=="undefined"?vitSrcOmdo(PERFIL.av):null;
  const rivSrc=J.rival.src?(J.rival.av!=null?vitSrcOmdo(J.rival.av):null):vitSrcRival(J.rival.a);

function desenharBiblioteca(){
  const cv=$("#biblioteca"),dpr=Math.min(window.devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const tons=["#3b2263","#43286f","#4d2f7d","#36205b","#57378a","#2f1a4f","#5f3f96","#47297a"];
  c.fillStyle="#1c0e30";c.fillRect(0,0,W,H);
  const alt=Math.max(120,Math.min(170,H/5)),tabua=12;
  for(let y=-20;y<H;y+=alt){
    const base=y+alt-tabua,g=c.createLinearGradient(0,y,0,base);g.addColorStop(0,"#160a27");g.addColorStop(1,"#241238");
    c.fillStyle=g;c.fillRect(0,y,W,alt-tabua);let x=-10;
    while(x<W){
      if(rnd()<.06){x+=20+rnd()*40;continue}
      if(rnd()<.05){let yy=base;const n=2+Math.floor(rnd()*3),w=70+rnd()*30;
        for(let k=0;k<n;k++){const h=12+rnd()*8;c.fillStyle=tons[Math.floor(rnd()*tons.length)];c.fillRect(x+rnd()*8,yy-h,w-k*6,h);
          c.fillStyle="rgba(255,255,255,.10)";c.fillRect(x+6,yy-h+3,w-k*6-14,2);yy-=h}x+=w+10;continue}
      const w=12+rnd()*22,h=(alt-tabua)*(.55+rnd()*.38),cor=tons[Math.floor(rnd()*tons.length)];
      const inc=rnd()<.07?(rnd()<.5?-1:1)*(.12+rnd()*.12):0;
      c.save();c.translate(x+(inc>0?w:0),base);c.rotate(inc);const bx=inc>0?-w:0;
      c.fillStyle=cor;c.fillRect(bx,-h,w,h);
      const lg=c.createLinearGradient(bx,0,bx+w,0);lg.addColorStop(0,"rgba(0,0,0,.30)");lg.addColorStop(.35,"rgba(255,255,255,.10)");lg.addColorStop(1,"rgba(0,0,0,.35)");
      c.fillStyle=lg;c.fillRect(bx,-h,w,h);c.fillStyle="rgba(214,170,255,.22)";const f=rnd();
      if(f<.6){c.fillRect(bx+2,-h+8,w-4,2);c.fillRect(bx+2,-14,w-4,2)}if(f<.25)c.fillRect(bx+3,-h*.55,w-6,h*.14);
      if(f>.8){c.fillStyle="rgba(255,194,26,.18)";c.fillRect(bx+2,-h+12,w-4,3)}
      c.restore();x+=w+(inc?10:1+rnd()*2);
    }
    c.fillStyle="#2a1645";c.fillRect(0,base,W,tabua);c.fillStyle="rgba(200,160,255,.18)";c.fillRect(0,base,W,2);
    c.fillStyle="rgba(0,0,0,.45)";c.fillRect(0,base+tabua,W,6);
  }
  for(let px=0;px<W+300;px+=Math.max(300,W/4)){c.fillStyle="#24113d";c.fillRect(px-9,0,18,H);c.fillStyle="rgba(200,160,255,.12)";c.fillRect(px-9,0,2,H)}
}

      c.el.style.transform=`translate(${x-C.w/2}px,${y-C.w*.83}px) rotateY(${Math.cos(a)*55}deg) rotateZ(${c.rot+s*c.vr}deg) scale(${esc*(.4+.6*ent)})`;
      c.el.style.zIndex=frente?3:1;c.el.style.opacity=dentro?0:(.35+.65*(z+1)/2)*ent;c.el.style.transition="opacity .25s";

    raf=requestAnimationFrame(passo);

  PERFIL.nome=limpaNome(n);salvarPerfil();
  const {modo,com,nivel}=JR;fecharComQuem();SOM.brilho();
  if(modo==="supremo"){SUPPREF.nivel=nivel;salvarSup();return com==="amigos"?supOnInicio():supIniciar()}
  PREF.modo=modo;PREF.nivel=nivel;salvarPref();
  if(com==="amigos")onlineInicio(modo);else iniciar();
}
function fecharComQuem(){const d=document.querySelector(".cq");if(d)d.remove()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!b.closest(".cq"))return;
  e.stopImmediatePropagation();
  if(b.dataset.jrcom){JR.com=b.dataset.jrcom;JR.passo=2;SOM.selecionar();jrRender()}
  else if(b.dataset.jrnivel){JR.nivel=b.dataset.jrnivel;SOM.selecionar();if(document.querySelector(".jr-tempo")){document.querySelectorAll("[data-jrnivel]").forEach(x=>x.setAttribute("aria-checked",x===b))}else{JR.passo=3;jrRender()}}
  else if(b.dataset.jrtempo!==undefined){PREF.tempo=b.dataset.jrtempo;try{salvarPref()}catch(e){}SOM.selecionar();document.querySelectorAll("[data-jrtempo]").forEach(x=>x.setAttribute("aria-checked",x===b))}
  else if(b.id==="jr-seguir"){SOM.clique();JR.passo=3;jrRender()}
  else if(b.dataset.jrav!==undefined){PERFIL.av=Number(b.dataset.jrav);document.querySelectorAll("[data-jrav]").forEach(x=>x.setAttribute("aria-checked",x===b));$("#jr-img").src=omdoSrc(PERFIL.av);SOM.selecionar();
    if(!calmo)$("#jr-img").animate([{transform:"scale(.6) rotate(-10deg)"},{transform:"scale(1.1)"},{transform:"scale(1)"}],{duration:400})}
  else if(b.id==="jr-ir")jrIr();
  else if(b.id==="jr-voltar"){SOM.clique();if(JR.passo===1)fecharComQuem();else{JR.passo--;jrRender()}}
},true);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="jr-apelido")jrIr()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector(".cq")){e.stopImmediatePropagation();fecharComQuem()}},true);
</script>
