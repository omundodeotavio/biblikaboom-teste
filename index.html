<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="arte/icone-app-180.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="arte/icone-app-192.png?v=3">
<meta name="apple-mobile-web-app-title" content="Biblikaboom">
<meta name="theme-color" content="#3b1c60">
<title>Biblikaboom</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Biblikaboom: o jogo de cartas da Bíblia do O Mundo de Otávio.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800&display=swap">
<style>
/* Layout: o manual impresso do Biblikaboom virou app. Blocos de cor chapados (ouro, roxo, rosa, azul), títulos pesados em duas cores,
   cartas reais inclinadas e mãos segurando cartas. A mesa de jogo fica sobre a biblioteca roxa. */
:root{
  --ouro:#f7b52c;--ouro-esc:#d98d0b;--roxo:#3b1c60;--roxo-med:#6b3aa6;--roxo-esc:#2a1342;--noite:#1a0c2c;
  --rosa:#e8327c;--azul:#2b8fe0;--verde:#2fa35a;--lilas:#c8b5ee;--branco:#ffffff;--tinta:#1a0b2b;
  --ok:#3ddc84;--nao:#ff5d6c;
  --cartoon:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --texto:"Montserrat","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--noite);color:var(--branco);font-family:var(--texto);font-weight:600;font-size:16px;overflow-x:hidden}
#biblioteca{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
.luz{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(rgba(10,3,20,.62),rgba(10,3,20,.62)),radial-gradient(ellipse at center,transparent 25%,rgba(8,2,16,.92) 100%)}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
.miolo{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Marca BIBLIKABOOM! ---------- */
.logo-img{width:var(--w,320px);max-width:100%;height:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.logo{position:relative;display:inline-grid;place-items:center;isolation:isolate}
.logo svg{position:absolute;inset:-30% -8%;width:116%;height:160%;z-index:-1}
.logo b{font-family:var(--cartoon);font-weight:400;font-size:var(--t,64px);line-height:1;letter-spacing:.01em;
  background:linear-gradient(180deg,#ffe25a 0%,#ffb21f 55%,#ff8a12 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.06em var(--tinta);paint-order:stroke fill;filter:drop-shadow(0 .05em 0 #fff) drop-shadow(0 -.03em 0 #fff) drop-shadow(.04em 0 0 #fff) drop-shadow(-.04em 0 0 #fff) drop-shadow(.06em .08em 0 var(--tinta));
  transform:rotate(-3deg)}
.titulo{font-family:var(--texto);font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:-.01em;margin:0;text-wrap:balance}
.titulo .c1{display:block;font-size:.62em;color:var(--t1,var(--roxo))}
.titulo .c2{display:block;color:var(--t2,var(--branco))}
.etiqueta{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--roxo-esc);color:var(--ouro)}
.botao{font-family:var(--cartoon);font-weight:400;font-size:clamp(22px,3vw,30px);letter-spacing:.04em;color:var(--tinta);
  background:linear-gradient(180deg,#ffe25a,var(--ouro) 60%,var(--ouro-esc));border:3px solid var(--tinta);border-radius:16px;padding:12px 30px 8px;
  box-shadow:0 6px 0 var(--tinta);transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-block}
.botao:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tinta)}
.botao.sec{background:var(--branco);font-size:clamp(18px,2.4vw,22px);padding:10px 22px 6px}
.chip-grupo{display:flex;background:var(--roxo-esc);border:2px solid #000;border-radius:999px;padding:4px;gap:2px}
.chip-grupo button{font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-radius:999px;padding:8px 14px;color:var(--lilas)}
.chip-grupo button[aria-pressed="true"]{background:var(--ouro);color:var(--tinta)}

/* ---------- Início ---------- */
.inicio{display:flex;flex-direction:column;gap:0}
.hero{background:var(--ouro);color:var(--tinta);position:relative;overflow:hidden;
  margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:36px;
  background-image:radial-gradient(rgba(0,0,0,.07) 1.5px,transparent 1.6px);background-size:14px 14px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:64px;background:var(--roxo);clip-path:polygon(0 100%,100% 22%,100% 100%)}
.hero .miolo{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:center;position:relative;z-index:1}
@media (max-width:780px){.hero .miolo{grid-template-columns:1fr;text-align:center;justify-items:center}}
.hero .logo-img{--w:clamp(280px,40vw,500px);margin:6px 0 4px -3%}
.hero p{font-weight:800;font-size:clamp(17px,2vw,21px);text-transform:uppercase;line-height:1.2;max-width:28ch;margin:0 0 18px;text-wrap:balance}
.hero p em{font-style:italic;color:var(--roxo)}
.hero-arte{position:relative;width:min(100%,460px);aspect-ratio:1/1}
.hero-arte img{position:absolute;filter:drop-shadow(0 12px 16px rgba(0,0,0,.35))}
.hero-arte .c1{width:44%;left:6%;top:8%;transform:rotate(-14deg)}
.hero-arte .c2{width:44%;left:44%;top:2%;transform:rotate(9deg)}
.hero-arte .mao{width:50%;left:30%;top:24%}
.flutua{animation:flutua 4s ease-in-out infinite alternate}
@keyframes flutua{to{translate:0 -10px}}
.selo-omdo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--roxo)}
.selo-omdo img{width:54px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.marcas{display:flex;align-items:center;gap:12px}.omdo-t{width:44px}
.rodape .omdo-r{width:56px}
.fan{position:absolute;left:50%;bottom:-8px;width:0;height:100%}
.fan img{position:absolute;bottom:0;width:var(--cw,96px);max-width:none;left:calc(var(--cw,96px) / -2);transform-origin:50% 120%;transform:rotate(calc(var(--i) * 13deg)) translateX(calc(var(--i) * 14px));filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));border-radius:8px;transition:transform .25s}
.modo .fan{--cw:118px;bottom:-14px}.modo:hover .fan img{transform:rotate(calc(var(--i) * 17deg)) translateX(calc(var(--i) * 20px)) translateY(-6px)}
.outro-fan{position:relative;display:block;width:130px;height:150px}.outro-fan .fan{--cw:70px;bottom:6px}.outro .fan img{width:var(--cw)}


.faixa-roxa{background:var(--roxo);padding-block:20px 48px}
.faixa-roxa .titulo{font-size:clamp(34px,5vw,54px);--t1:var(--ouro);margin-bottom:22px}
.modos{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:70px}
@media (max-width:860px){.modos{grid-template-columns:1fr;gap:84px;max-width:440px;margin-inline:auto}}
.modo{position:relative;text-align:left;border:4px solid var(--tinta);border-radius:22px;padding:0;background:var(--fundo);color:var(--branco);
  box-shadow:0 8px 0 var(--tinta);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;min-height:330px}
.modo:hover{transform:translateY(-4px) rotate(-.6deg)}
.modo[aria-pressed="true"]{box-shadow:0 0 0 5px var(--branco),0 8px 0 5px var(--tinta),0 0 46px rgba(255,214,90,.55)}
.modo .arte{position:relative;display:block;height:150px}
.modo .num{position:absolute;top:12px;left:14px;z-index:2;font-family:var(--texto);font-weight:900;font-size:44px;line-height:1;color:rgba(255,255,255,.95);-webkit-text-stroke:2px var(--tinta);paint-order:stroke fill}
.modo .num small{font-size:.55em}
.modo .corpo{background:var(--branco);color:var(--tinta);border-radius:0 0 17px 17px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1;border-top:4px solid var(--tinta)}
.modo .nome{font-family:var(--cartoon);font-weight:400;font-size:40px;line-height:.9;letter-spacing:.02em;color:var(--cor);-webkit-text-stroke:1.5px var(--tinta);paint-order:stroke fill;text-shadow:3px 3px 0 var(--tinta)}
.modo .qual{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.modo .bkb{font-weight:700;font-size:14px;line-height:1.35;color:#4b3a5e}
.modo .bkb b{color:var(--rosa)}
.modo .marca-ok{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border-radius:50%;background:var(--ok);border:4px solid var(--tinta);display:grid;place-items:center;opacity:0;transform:scale(.4);transition:.2s}
.modo[aria-pressed="true"] .marca-ok{opacity:1;transform:scale(1)}
.modo .marca-ok svg{width:22px;height:22px}

.ajustes{display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center;justify-content:center;margin-top:44px;background:var(--roxo-esc);border:3px solid #000;border-radius:22px;padding:20px}
.ajuste{display:flex;flex-direction:column;gap:8px;align-items:center}
.ajuste>span{font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro)}
.jogar-box{display:flex;align-items:center;gap:6px}
.jogar-box img{width:86px;margin-right:-14px;transform:rotate(-18deg) scaleX(-1);filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
@media (max-width:520px){.jogar-box img{display:none}}

.outros{background:var(--rosa);padding-block:40px 46px;position:relative}
.outros::before{content:"";position:absolute;left:0;right:0;top:-1px;height:40px;background:var(--roxo);clip-path:polygon(0 0,100% 0,0 100%)}
.outros .titulo{font-size:clamp(30px,4.4vw,46px);--t1:var(--tinta);margin:14px 0 20px}
.outros-grade{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:720px){.outros-grade{grid-template-columns:1fr}}
.outro{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center;background:var(--branco);color:var(--tinta);border:4px solid var(--tinta);border-radius:20px;padding:14px;box-shadow:0 6px 0 var(--tinta)}
.outro img{width:130px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.outro h3{margin:0;font-family:var(--cartoon);font-weight:400;font-size:30px;line-height:1;color:var(--roxo)}
.outro p{margin:4px 0 10px;font-size:14px;line-height:1.35;color:#4b3a5e}
.outro .botao{font-size:18px;padding:8px 16px 4px}
.em-breve{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--roxo-esc);color:var(--ouro);padding:6px 12px;border-radius:999px}

.jr-tempo{margin-top:18px}
.jr-sub{margin:0 0 10px;text-align:center;font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro)}
.jr-tempos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jr-tp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:16px;border:3px solid #000;background:var(--roxo-esc);color:#fff;font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.jr-tp svg{width:26px;height:26px;fill:none;stroke:var(--lilas);stroke-width:2.2;stroke-linecap:round}
.jr-tp b{font-size:16px;font-weight:900}.jr-tp span{font-size:11.5px;line-height:1.25;color:var(--lilas);text-align:center}
.jr-tp[aria-checked="true"]{background:var(--ouro);color:var(--tinta);box-shadow:0 0 0 3px #fff3,0 0 22px #ffc83d88;transform:translateY(-2px)}
.jr-tp[aria-checked="true"] svg{stroke:var(--tinta)}.jr-tp[aria-checked="true"] span{color:#3a2400}
.jr-seguir{display:block;margin:18px auto 0}
.so-sala .miolo{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.so-rot{margin:0;font-weight:900;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro)}
.so-cod{font-family:var(--cartoon);font-size:clamp(56px,14vw,96px);letter-spacing:.12em;line-height:1;color:#fff;-webkit-text-stroke:.06em var(--tinta);paint-order:stroke fill;text-shadow:0 6px 0 var(--tinta)}
.so-lista{list-style:none;margin:8px 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(100%,640px)}
@media (max-width:560px){.so-lista{grid-template-columns:repeat(2,minmax(0,1fr))}}
.so-j{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--roxo-esc);border:3px solid #000;border-radius:18px;padding:12px 8px;min-width:0}
.so-j img{width:72px;height:72px;border-radius:50%;border:3px solid var(--ouro);object-fit:cover;background:#fff}
.so-j b{font-size:14px;overflow-wrap:anywhere}.so-j small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ouro)}
.so-j.vazio{opacity:.55;border-style:dashed}.so-j.vazio span{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;border:3px dashed var(--lilas);font-family:var(--cartoon);font-size:32px;color:var(--lilas)}
.so-regra{display:flex;flex-direction:column;align-items:center;gap:8px}
#so-comecar[disabled]{opacity:.6;cursor:default}
.jr-aprender{display:flex;align-items:center;gap:10px;margin:14px auto 0;background:none;border:2px dashed var(--lilas);border-radius:16px;padding:8px 14px;color:#fff;font:inherit;font-size:14px;cursor:pointer}
.jr-aprender img{width:34px;height:auto}.jr-aprender b{color:var(--ouro)}
.coach{position:fixed;inset:0;z-index:80;pointer-events:none}
.coach-veu{position:absolute;inset:0;background:rgba(20,6,36,.45)}
.coach-foco{position:fixed;border-radius:16px;box-shadow:0 0 0 4px var(--ouro),0 0 26px 6px rgba(255,200,61,.7),0 0 0 9999px rgba(20,6,36,.55);transition:all .25s;animation:coachPulsa 1.2s ease-in-out infinite alternate}
@keyframes coachPulsa{to{box-shadow:0 0 0 6px var(--ouro),0 0 36px 10px rgba(255,200,61,.85),0 0 0 9999px rgba(20,6,36,.55)}}
.coach-mao{position:fixed;width:clamp(56px,9vw,86px);transform:translate(-20%,-8%) rotate(-18deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:coachMao .8s ease-in-out infinite alternate}
@keyframes coachMao{to{transform:translate(-20%,-24%) rotate(-12deg)}}
.coach-bolha{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));translate:-50% 0;width:min(calc(100% - 32px),560px);display:flex;gap:14px;align-items:center;background:#fff;color:var(--tinta);border:4px solid var(--tinta);border-radius:24px;padding:14px 18px;box-shadow:0 8px 0 var(--tinta),0 20px 40px rgba(0,0,0,.4);pointer-events:auto}
.coach-av{width:72px;height:72px;border-radius:50%;border:3px solid var(--ouro);background:#efe6ff;object-fit:cover;flex:none}
.coach-bolha p{margin:0;font-size:clamp(16px,2.2vw,20px);font-weight:700;line-height:1.35}.coach-bolha p b{color:var(--roxo)}
.coach-bolha .botao{margin-top:10px;font-size:18px}
@media (prefers-reduced-motion:reduce){.coach-foco,.coach-mao{animation:none}}
.vitoria{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 46%,#7a3fc0 0%,#3b1c60 45%,#1d0a33 100%);animation:vitEntra .35s ease both}
.vitoria.sai{animation:vitSai .38s ease forwards}
@keyframes vitEntra{from{opacity:0}}@keyframes vitSai{to{opacity:0;transform:scale(1.04)}}
.vitoria .confete{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.vit-raios{position:absolute;left:50%;top:44%;width:180vmax;height:180vmax;translate:-50% -50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,90,.22) 0 9deg,transparent 9deg 22deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,transparent 55%);mask-image:radial-gradient(circle,#000 0%,transparent 55%);animation:vitGira 14s linear infinite}
@keyframes vitGira{to{rotate:360deg}}
.vit-palco{position:relative;z-index:2;display:grid;place-items:end center;height:min(56vh,540px);margin-top:-12vh}
.vit-palco::after{content:"";position:absolute;bottom:-2%;left:50%;width:70%;height:8%;translate:-50% 0;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(8px);z-index:-1}
.vit-corpo{height:100%;width:auto;max-width:90vw;object-fit:contain;filter:drop-shadow(0 0 30px rgba(255,214,90,.55));animation:vitSobe .8s cubic-bezier(.2,1.5,.4,1) both,vitPula 1.6s .9s ease-in-out infinite alternate;transform-origin:50% 100%}
.vit-retrato{width:min(56vw,300px);aspect-ratio:1;border-radius:50%;border:8px solid var(--ouro);background:#efe6ff;object-fit:cover;box-shadow:0 0 40px rgba(255,214,90,.7);animation:vitSobe .8s cubic-bezier(.2,1.5,.4,1) both,vitPula 1.6s .9s ease-in-out infinite alternate;align-self:center}
@keyframes vitSobe{from{transform:translateY(60%) scale(.6);opacity:0}}
@keyframes vitPula{to{transform:translateY(-3%) rotate(1.5deg)}}
.vit-nome{position:absolute;z-index:4;left:50%;bottom:max(12vh,90px);translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:2px;animation:vitNome .6s .45s cubic-bezier(.2,1.6,.4,1) both;text-align:center;width:max-content;max-width:92vw}
.vit-nome b{font-family:var(--cartoon);font-weight:400;font-size:clamp(46px,11vw,96px);line-height:1;color:var(--ouro);-webkit-text-stroke:.07em var(--tinta);paint-order:stroke fill;text-shadow:0 6px 0 var(--tinta);text-transform:uppercase;overflow-wrap:anywhere}
.vit-nome span{font-family:var(--cartoon);font-size:clamp(26px,6vw,48px);color:#fff;-webkit-text-stroke:.07em var(--tinta);paint-order:stroke fill;text-shadow:0 4px 0 var(--tinta)}
@keyframes vitNome{from{transform:scale(.3);opacity:0}}
.vit-toque{position:absolute;z-index:4;bottom:max(3vh,18px);left:0;right:0;text-align:center;margin:0;color:var(--lilas);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;animation:vitEntra .4s 1.6s both}
@media (prefers-reduced-motion:reduce){.vit-raios,.vit-corpo,.vit-retrato,.vit-nome{animation:none}}
.rodape{background:var(--roxo-esc);padding-block:24px 32px;text-align:center}
.rodape .linha-r{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.rodape img{width:34px}
.rodape p b{color:var(--ouro);font-weight:900;margin-right:2px}
.rodape p{margin:0;font-size:13px;color:var(--lilas);letter-spacing:.06em;text-transform:uppercase;font-weight:800}

/* ---------- Regras ilustradas ---------- */
.regras-topo{background:var(--roxo-esc);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:14px;position:sticky;top:0;z-index:5}
.regras-topo .miolo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.regras-topo .logo-img{--w:110px;margin:-6px 0}
.bloco{padding-block:42px;position:relative;background:var(--bg);color:var(--fg,var(--branco))}
.bloco .miolo{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.bloco.inv .miolo>.figura{order:-1}
@media (max-width:760px){.bloco .miolo{grid-template-columns:1fr}.bloco.inv .miolo>.figura{order:0}}
.bloco .titulo{font-size:clamp(34px,5vw,56px);margin-bottom:14px}
.bloco p{font-size:clamp(16px,1.8vw,18px);line-height:1.5;margin:0 0 12px;max-width:44ch}
.bloco p strong{font-weight:900;text-transform:uppercase}
.destaque{font-weight:800;font-style:italic;color:var(--dest,var(--rosa))}
.callout{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.22);border-radius:14px;padding:12px 14px;max-width:44ch}
.callout .n{font-family:var(--cartoon);font-size:34px;line-height:1;color:var(--ouro)}
.figura{position:relative;display:grid;place-items:center;min-height:260px}
.cena-cine{min-height:min(80vh,660px);display:flex;align-items:center;overflow:hidden;padding-block:60px}
.cena-cine .cc-arte{position:absolute;inset:0;overflow:hidden}
.cena-cine .cc-arte img{position:absolute;right:0;top:0;height:100%;width:auto;aspect-ratio:3/2;max-width:none;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%);mask-image:linear-gradient(90deg,transparent 0%,#000 30%);transform-origin:78% 95%;animation:ccMexe 7s ease-in-out infinite alternate}
.cena-cine .cc-arte::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(59,28,96,.9) 0%,rgba(59,28,96,.6) 32%,transparent 52%),linear-gradient(0deg,var(--roxo) 0%,transparent 22%),linear-gradient(180deg,var(--roxo-esc) 0%,transparent 16%)}
.cena-cine .miolo{display:block;position:relative;width:100%}
.cena-cine .miolo>div{max-width:min(46%,520px)}
.cena-cine p{text-shadow:0 2px 10px rgba(20,0,40,.7)}
@keyframes ccMexe{0%{transform:scale(1.06) rotate(-1.2deg) translate(-1%,.5%)}50%{transform:scale(1.08) rotate(0) translate(0,-1%)}100%{transform:scale(1.06) rotate(1.2deg) translate(1%,.5%)}}
@media (max-width:760px){
  .cena-cine{display:block;min-height:0;padding-block:0 36px}
  .cena-cine .cc-arte{position:relative;aspect-ratio:4/3.4;margin-bottom:-18%}
  .cena-cine .cc-arte img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-position:66% 40%;-webkit-mask-image:none;mask-image:none}
  .cena-cine .cc-arte::after{background:linear-gradient(0deg,var(--roxo) 4%,rgba(59,28,96,.6) 22%,transparent 45%),linear-gradient(180deg,var(--roxo-esc) 0%,transparent 14%)}
  .cena-cine .miolo>div{max-width:none}}
@media (prefers-reduced-motion:reduce){.cena-cine .cc-arte img{animation:none}}
.figura img{filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
.leque{position:relative;width:min(100%,380px);height:300px}
.leque img{position:absolute;width:46%;top:0;left:27%;transform-origin:50% 110%}
.leque img:nth-child(1){transform:rotate(-16deg) translateX(-30%)}
.leque img:nth-child(2){transform:rotate(0deg);z-index:1}
.leque img:nth-child(3){transform:rotate(16deg) translateX(30%)}
.dupla{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.dupla figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.dupla figcaption{font-family:var(--cartoon);font-size:24px;color:var(--ok);text-shadow:2px 2px 0 var(--tinta)}
.dupla figure.perde figcaption{color:var(--nao)}
.dupla img{width:min(42vw,170px)}
.dupla .x{font-family:var(--cartoon);font-size:40px;color:var(--ouro);text-shadow:3px 3px 0 var(--tinta)}
.modos-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.modos-mini{grid-template-columns:1fr}}
.modo-mini{background:var(--branco);color:var(--tinta);border:4px solid var(--tinta);border-radius:18px;padding:14px;box-shadow:0 6px 0 var(--tinta)}
.modo-mini b{font-family:var(--cartoon);font-weight:400;font-size:30px;color:var(--cor);-webkit-text-stroke:1px var(--tinta);paint-order:stroke fill;text-shadow:2px 2px 0 var(--tinta)}
.modo-mini b{display:flex;align-items:center;gap:10px}.modo-mini .ic-mini{width:46px;height:46px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 0 rgba(26,11,43,.35))}
.modo-mini p{margin:6px 0 0;font-size:14px;line-height:1.4;color:#4b3a5e}

/* ---------- Mesa ---------- */
.jogo{padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
.barra{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.emblema{display:flex;align-items:center;gap:10px}
.emblema .disco{width:48px;height:48px;border-radius:50%;background:var(--fundo);border:3px solid var(--tinta);overflow:hidden;display:grid;place-items:center;box-shadow:0 3px 0 var(--tinta)}
.emblema .disco img{width:100%;margin-top:30%;max-width:none}
.emblema b{font-family:var(--cartoon);font-weight:400;font-size:30px;line-height:1;color:var(--cor);-webkit-text-stroke:1.5px var(--tinta);paint-order:stroke fill;text-shadow:2px 2px 0 var(--tinta)}
.placar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;background:rgba(42,19,66,.9);border:2px solid #000;border-radius:999px;padding:5px 12px 5px 6px}
.pl i{width:18px;height:26px;border-radius:4px;background:var(--c,var(--ouro));border:2px solid var(--tinta);display:block}
.pl b{font-size:17px;font-variant-numeric:tabular-nums}
.sair{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;background:var(--nao);border:3px solid var(--tinta);border-radius:999px;padding:7px 16px 7px 12px;color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--tinta);transition:transform .12s;min-height:40px}
.sair svg{width:14px;height:14px}
.sair:hover{transform:translateY(-2px)}
.sair:active{transform:translateY(2px);box-shadow:0 2px 0 var(--tinta)}
#voltar.sair,#voltar2.sair{background:var(--branco);color:var(--tinta)}
.confirma{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,3,20,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px}
.conf-caixa{background:var(--branco);color:var(--tinta);border:4px solid var(--tinta);border-radius:24px;padding:24px 20px;max-width:400px;width:100%;text-align:center;box-shadow:0 10px 0 var(--tinta);animation:confEntra .25s cubic-bezier(.3,1.5,.5,1)}
@keyframes confEntra{from{transform:scale(.85);opacity:0}}
.conf-caixa h2{margin:0 0 6px;font-family:var(--cartoon);font-weight:400;font-size:34px;line-height:1;color:var(--roxo)}
.conf-caixa p{margin:0 0 16px;font-weight:600;color:#4b3a5e}
.conf-caixa .botoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.botao.sair-sim{background:var(--nao);color:#fff}
.mensagem{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:74px;justify-content:center}
.mensagem .m1{font-family:var(--cartoon);font-weight:400;font-size:clamp(26px,4vw,44px);line-height:1;letter-spacing:.02em;text-shadow:3px 3px 0 var(--tinta);text-wrap:balance}
.mensagem .m2{font-size:15px;color:var(--lilas);text-wrap:balance}
.m1.ganhou{color:var(--ok)}.m1.perdeu{color:var(--nao)}.m1.empate{color:var(--ouro)}
.pensando::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:pontos 1s steps(4) infinite}
@keyframes pontos{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.mesa{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,4vw,70px);justify-items:center;align-items:start;position:relative}
.vs{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-6deg);z-index:3;font-family:var(--cartoon);font-size:clamp(30px,5vw,58px);color:var(--ouro);-webkit-text-stroke:2px var(--tinta);paint-order:stroke fill;text-shadow:4px 4px 0 var(--tinta);pointer-events:none}
.lado{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;min-width:0}
.quem{display:flex;align-items:center;gap:8px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:15px}
.quem .av{width:34px;height:34px;border-radius:50%;border:3px solid var(--tinta);display:grid;place-items:center;background:var(--c)}
.quem .av svg{width:20px;height:20px}
.quem .av.av-foto{width:44px;height:44px}.av-foto{overflow:hidden;padding:0}.av-foto img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.quem{text-transform:none!important}
.slot{position:relative;width:min(100%,320px);isolation:isolate}
.slot::before{content:"";position:absolute;inset:-16% -34%;z-index:-1;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(255,214,90,.40) 0%,rgba(255,170,40,.16) 38%,transparent 70%);opacity:.75;transition:opacity .3s}
.slot.vence::before{opacity:1;background:radial-gradient(ellipse at center,rgba(255,226,110,.85) 0%,rgba(255,180,40,.38) 38%,transparent 72%)}
.slot.perde .carta-img{filter:saturate(.45) brightness(.6)}
.pilha{position:absolute;inset:0;border-radius:7%/4.2%;background:#2a1645 center/cover url("verso.webp");border:2px solid #000;z-index:-1}
.pilha.p1{transform:translate(6px,8px) rotate(2deg)}.pilha.p2{transform:translate(-5px,12px) rotate(-3deg)}
.giro{perspective:1400px}
.interno{position:relative;aspect-ratio:50/83;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.35,.5,1)}
.interno.fechada{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7%/4.2%}
.face.costas{transform:rotateY(180deg);background:#2a1645 center/cover url("verso.webp");box-shadow:0 18px 34px rgba(0,0,0,.6)}
.carta-img{width:100%;height:100%;object-fit:cover;border-radius:7%/4.2%;box-shadow:0 18px 34px rgba(0,0,0,.6);transition:filter .3s}
.alvo{position:absolute;left:11%;width:79.4%;height:6.6%;border-radius:8px;border:0;background:transparent;padding:0;transition:box-shadow .15s,transform .15s}
.alvo.pode{box-shadow:0 0 0 2px rgba(255,194,26,.55)}
.alvo.pode:hover,.alvo.pode:focus-visible{box-shadow:0 0 0 4px var(--ouro),0 0 22px rgba(255,194,26,.9);transform:scale(1.03);outline:0}
.alvo.marcado{box-shadow:0 0 0 4px var(--ouro),0 0 26px rgba(255,194,26,.95);animation:pulso 1s ease-in-out infinite alternate}
@keyframes pulso{to{box-shadow:0 0 0 6px var(--ouro),0 0 36px rgba(255,214,90,1)}}
.poder{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:2px solid var(--tinta);background:linear-gradient(180deg,#ffe25a,var(--ouro));color:var(--tinta)}
.poder.gasto{background:#6d5f80;color:#e7dcf6}
.mao-dica{position:absolute;width:110px;right:-86px;top:40%;transform:rotate(-24deg);filter:drop-shadow(0 8px 8px rgba(0,0,0,.45));animation:aponta 1.1s ease-in-out infinite alternate;pointer-events:none;z-index:4}
@keyframes aponta{to{translate:-12px -6px}}
@media (max-width:900px){.mao-dica{display:none}}
.comando{display:flex;justify-content:center;min-height:64px;margin-top:8px}
.dica-baixo{text-align:center;font-size:13px;color:var(--lilas)}

.boom{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20}
.boom .logo-img{--w:clamp(300px,70vw,720px);animation:boom 1.7s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes boom{0%{transform:scale(.2) rotate(-14deg);opacity:0}22%{transform:scale(1.12) rotate(-3deg);opacity:1}78%{transform:scale(1) rotate(-3deg);opacity:1}100%{transform:scale(1.35) rotate(-3deg);opacity:0}}

.fim{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,3,20,.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fim .caixa{position:relative;background:var(--ouro);color:var(--tinta);border:4px solid var(--tinta);border-radius:26px;padding:120px 22px 24px;max-width:440px;width:100%;text-align:center;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 0 var(--tinta),0 0 80px rgba(255,190,50,.35);margin-top:90px;
  background-image:radial-gradient(rgba(0,0,0,.07) 1.5px,transparent 1.6px);background-size:14px 14px}
.fim .caixa>img{position:absolute;width:250px;left:50%;top:-110px;transform:translateX(-50%);filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}
.fim h2{margin:0;font-family:var(--cartoon);font-weight:400;font-size:46px;line-height:1;color:var(--roxo);text-shadow:3px 3px 0 #fff}
.fim p{margin:0;font-weight:700;line-height:1.4}
.fim .botoes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.fim .botao{background:var(--branco)}
.fim.perdeu .caixa{background:var(--lilas)}

@media (max-width:560px){
  .mesa{gap:10px;grid-template-columns:1.3fr 1fr}
  .vs{display:none}
  .mensagem{min-height:64px}
  .emblema b{font-size:24px}.emblema .disco{width:40px;height:40px}
  .quem{font-size:13px}
}

/* ---------- Movimento: inclinação 3D, brilho, distribuição ---------- */
[data-tilt]{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;transform-style:preserve-3d;will-change:transform}
[data-tilt].solto{transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.brilho{position:absolute;inset:0;border-radius:7%/4.2%;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.35),transparent 45%);mix-blend-mode:soft-light;opacity:0;transition:opacity .2s}
[data-tilt]:hover .brilho{opacity:1}
.chega{animation:chega .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes chega{from{transform:translateY(-60px) rotate(-10deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
.chega-r{animation:chegaR .55s .08s cubic-bezier(.2,1.3,.4,1) both}
@keyframes chegaR{from{transform:translateY(-60px) rotate(10deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
.hero-arte{cursor:pointer}
.hero-arte.toque .c1{animation:salta1 .9s cubic-bezier(.2,1.4,.4,1)}
.hero-arte.toque .c2{animation:salta2 .9s cubic-bezier(.2,1.4,.4,1)}
.hero-arte.toque .mao{animation:aperta .5s ease}
@keyframes salta1{40%{transform:rotate(-34deg) translate(-30px,-40px) scale(1.08)}}
@keyframes salta2{40%{transform:rotate(30deg) translate(30px,-50px) scale(1.08)}}
@keyframes aperta{40%{transform:scale(.94) rotate(-3deg)}}
.dica-hero{position:absolute;bottom:4%;right:6%;font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--roxo);background:#fff;border:2px solid var(--tinta);border-radius:999px;padding:4px 10px}
.vence .carta-img{animation:vibra .6s ease}
@keyframes vibra{30%{transform:scale(1.05) rotate(1.5deg)}60%{transform:scale(1.02) rotate(-1deg)}}


/* ---------- Cena 3D do Otávio ---------- */
.cena-box{position:relative;width:100%;max-width:720px;aspect-ratio:1672/941;border-radius:26px;border:5px solid var(--tinta);overflow:hidden;cursor:pointer;
  box-shadow:0 10px 0 var(--tinta),0 24px 50px rgba(60,20,90,.45);background:#2a1342;container-type:inline-size}
.cena{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;transform:scale(calc(100cqw / 1672px))}
@supports not (width:1cqw){.cena{transform:scale(.42)}}
.cena-carta{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.cena-carta img{position:absolute;left:0;top:0;width:480px;height:797px;max-width:none;transform-origin:0 0}
.cena-carta img.troca{animation:troca .55s ease-in-out}
@keyframes troca{0%{filter:brightness(1)}45%{filter:brightness(2.4) saturate(.3)}100%{filter:brightness(1)}}
.cena-img{position:absolute;left:0;top:0;width:1672px;height:941px;max-width:none;pointer-events:none}
.cena-luz{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,62%) var(--my,30%),rgba(255,236,170,.35),transparent 38%);mix-blend-mode:soft-light;opacity:.8;transition:opacity .3s}
.cena-box:hover .cena-luz{opacity:1}
.cena-box.toque{animation:sacode .5s ease}
@keyframes sacode{30%{transform:perspective(900px) rotateZ(-1.5deg) scale(.98)}65%{transform:perspective(900px) rotateZ(1deg) scale(1.01)}}
.hero .miolo{grid-template-columns:1fr 1.25fr!important}
@media (max-width:780px){.hero .miolo{grid-template-columns:1fr!important}.cena-box{border-radius:20px}}

/* ---------- Hero cinematográfico (arte principal) ---------- */
.hero{background:#1a0b2b!important;background-image:none!important;color:#fff;padding:0!important;margin-top:calc(-1 * env(safe-area-inset-top,0px));
  min-height:min(100svh,64vw,980px);display:grid;align-items:center;isolation:isolate}
.hero::after{z-index:3;height:70px}
.palco{position:absolute;inset:0;z-index:0;overflow:hidden}
.palco-img{position:absolute;inset:-3%;width:106%;height:106%;max-width:none;object-fit:cover;object-position:70% 40%;
  transform:translate3d(calc(var(--px,0) * -14px),calc(var(--py,0) * -10px),0) scale(1.02);transition:transform .25s ease-out;animation:respira 14s ease-in-out infinite alternate}
@keyframes respira{from{scale:1}to{scale:1.045}}
.palco::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(20,6,36,.92) 0%,rgba(20,6,36,.72) 26%,rgba(20,6,36,.18) 48%,transparent 62%),
             linear-gradient(0deg,rgba(26,11,43,.85) 0%,transparent 26%)}
.palco-brilho{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:.0;
  background:radial-gradient(circle at var(--mx,52%) var(--my,30%),rgba(255,214,120,.55),transparent 30%);transition:opacity .4s}
.hero:hover .palco-brilho{opacity:.55}
.palco.toque .palco-brilho{animation:clarao .7s ease}
@keyframes clarao{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}
.faisca{position:absolute;z-index:2;width:6px;height:6px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,200,90,.8);pointer-events:none;opacity:0;animation:sobe 6s linear infinite}
.f1{left:44%;top:78%;animation-delay:0s}.f2{left:58%;top:88%;animation-delay:1.2s}.f3{left:72%;top:70%;animation-delay:2.4s}
.f4{left:84%;top:84%;animation-delay:3.1s}.f5{left:51%;top:60%;animation-delay:4s}.f6{left:92%;top:66%;animation-delay:5s}
@keyframes sobe{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-260px) translateX(30px) scale(1.2)}}
.hero-texto{position:relative;z-index:4;display:block!important;max-width:none!important;margin:0!important;padding-block:calc(env(safe-area-inset-top,0px) + 40px) 110px;
  padding-left:max(4vw,16px,env(safe-area-inset-left,0px))!important}
.hero-col{max-width:min(560px,38vw)}
.hero .logo-img{--w:min(36vw,500px)!important;margin-left:-2%!important}
@media (min-width:781px){
  .palco-img{inset:auto;top:-3%;right:-2%;left:auto;width:80%;height:106%;object-position:58% 40%;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
  .palco{background:radial-gradient(ellipse at 20% 40%,#3b1764,#1a0b2b 70%)}
  .palco::before{background:linear-gradient(90deg,rgba(20,6,36,.55) 0%,transparent 30%),linear-gradient(0deg,rgba(26,11,43,.85) 0%,transparent 26%)}
}
.hero p{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero p em{color:var(--ouro)!important}
.hero .selo-omdo{color:#fff}
.hero .logo-img{filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
@media (max-width:780px){
  .hero{min-height:0;display:block}
  .palco{position:relative;inset:auto;aspect-ratio:4/3.3;width:100%}
  .palco-img{object-position:76% 30%}
  .palco::before{background:linear-gradient(0deg,#1a0b2b 0%,rgba(26,11,43,.6) 18%,transparent 40%)}
  .hero-texto{margin-top:-64px;padding-block:0 96px;text-align:center}
  .hero-col{max-width:none;display:flex;flex-direction:column;align-items:center}
  .hero .logo-img{--w:min(78vw,380px)!important;margin:0 auto 4px!important}
}
@media (min-width:1600px){.hero-col{max-width:680px}.hero .logo-img{--w:620px!important}}
@media (prefers-reduced-motion:reduce){.palco-img,.faisca{animation:none!important}.palco-img{transform:none!important}}

/* ---------- Controle de som ---------- */
.som-ctl{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px}
.som-ctl button{width:44px;height:44px;border-radius:50%;border:3px solid var(--tinta);background:var(--ouro);color:var(--tinta);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 4px 0 var(--tinta),0 8px 20px rgba(0,0,0,.35);transition:transform .15s}
.som-ctl button:hover{transform:translateY(-2px)}
.som-ctl button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--tinta)}
.som-ctl svg{width:22px;height:22px}
.som-ctl .corte{display:none}
.som-ctl button[aria-pressed="false"]{background:#d9cfe6}
.som-ctl button[aria-pressed="false"] .corte{display:block}
@media (min-width:1600px){.som-ctl button{width:56px;height:56px}.som-ctl svg{width:28px;height:28px}}
/* ---------- Correções de sobreposição ---------- */
.regras-topo .miolo,.barra{padding-right:max(112px,calc(env(safe-area-inset-right,0px) + 112px))!important}
@media (min-width:1600px){.regras-topo .miolo,.barra{padding-right:140px!important}}
@media (max-width:700px){
  .barra{padding-right:0!important;flex-direction:column;align-items:flex-start}
  .regras-topo .miolo{padding-right:96px!important}
  .regras-topo .logo-img{--w:92px!important}
  .som-ctl{top:calc(env(safe-area-inset-top,0px) + 14px)}
  .som-ctl button{width:40px;height:40px}.som-ctl svg{width:20px;height:20px}
}
.modo .arte{height:172px!important}
.modo .fan{bottom:30px!important}
@media (min-width:1600px){.modo .arte{height:224px!important}}
.modo .corpo{position:relative;z-index:2}
.outro{grid-template-columns:118px minmax(0,1fr)!important;overflow:hidden}
.outro-fan{width:118px!important;height:150px!important;overflow:visible}
.outro-fan .fan{--cw:60px!important;bottom:12px!important}
.outro-fan .fan img{transform:rotate(calc(var(--i) * 9deg)) translateX(calc(var(--i) * 6px))!important}
.outro img{width:118px}
.outro>div{min-width:0}

/* ---------- Supremo ---------- */
.sup-capa{background:var(--rosa);padding-block:34px 30px;overflow:hidden}
.sup-capa .miolo{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.sup-capa .titulo .c1{text-shadow:none}
.sup-capa .titulo{font-size:clamp(44px,7vw,80px);--t1:var(--tinta);--t2:var(--branco);text-shadow:4px 4px 0 var(--tinta)}
.sup-capa p{font-weight:700;font-size:clamp(16px,2vw,19px);line-height:1.45;max-width:46ch;margin:12px 0 0}
.sup-capa-fan{position:relative;display:block;width:240px;height:220px}
.sup-capa-fan .fan{--cw:110px;bottom:10px}
@media (max-width:640px){.sup-capa .miolo{grid-template-columns:1fr;text-align:center;justify-items:center}.sup-capa-fan{width:220px;height:200px}.sup-capa .titulo .c2{text-shadow:3px 3px 0 var(--tinta)}}
.sup-passos{background:var(--roxo);padding-block:30px 50px}
.sup-passos ol{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.sup-passos ol{grid-template-columns:1fr 1fr}}
.sup-passos ol{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media (max-width:520px){.sup-passos ol{grid-template-columns:1fr}}
.sup-passos li{display:flex;gap:12px;align-items:flex-start;background:var(--roxo-esc);border:3px solid var(--tinta);border-radius:18px;padding:14px;line-height:1.4;font-size:15px}
.sup-passos li>b{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ouro);color:var(--tinta);display:grid;place-items:center;font-family:var(--cartoon);font-weight:400;font-size:22px;border:3px solid var(--tinta)}
.sup-passos li strong{color:var(--ouro)}
.sup-niveis{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:520px){.sup-niveis{grid-template-columns:1fr}}
.sup-niveis>div{background:var(--branco);color:var(--tinta);border:3px solid var(--tinta);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--tinta)}
.sup-niveis h3{margin:0;font-family:var(--cartoon);font-weight:400;font-size:26px;color:var(--rosa)}
.sup-niveis p{margin:4px 0 0;font-size:15px;line-height:1.4;color:#4b3a5e}
.sup-nota{font-size:13px;color:var(--lilas);text-align:center;margin:14px 0 18px}
.sup-painel{display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--roxo-esc);border:3px solid #000;border-radius:22px;padding:20px 14px;max-width:560px;margin:0 auto}
.sup-op{display:flex;flex-direction:column;align-items:center;gap:6px}
.sup-rot{font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro)}
.sup-painel .chip-grupo{flex-wrap:wrap;justify-content:center}
.sup-jogo{gap:10px}
.pl.sem-i{padding-left:12px}
.sup-topo{display:flex;align-items:center;justify-content:space-between;gap:14px}
.rivais{display:flex;gap:10px;flex-wrap:wrap;min-width:0}
.rival{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;background:var(--roxo-esc);border:2px solid #000;border-radius:16px;padding:8px 12px 8px 8px;transition:.25s;position:relative}
.rival .av{grid-row:1/3;width:38px;height:38px;border-radius:50%;background:var(--lilas);color:var(--lilas);display:grid;place-items:center;border:3px solid var(--tinta);background:var(--roxo-med)}
.rival .av svg{width:24px;height:24px;color:#e9dcff}
.rival .rn{font-family:var(--cartoon);font-size:20px;line-height:1;color:var(--branco)}
.rival .rq{font-size:12px;font-weight:700;color:var(--lilas)}
.rival .leque-v{display:none}
.rival.ativo{border-color:var(--ouro);box-shadow:0 0 0 3px var(--ouro),0 0 26px rgba(247,181,44,.5);transform:translateY(-2px)}
@keyframes pulsa{to{transform:scale(1.1)}}
.rival.ativo .av{animation:pulsa .7s ease-in-out infinite alternate}
.monte{flex:none;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--branco);cursor:default}
.monte .pilha{width:74px;display:block;position:relative}
.monte .pilha img{width:100%;display:block;border-radius:7%/4.2%;box-shadow:3px 3px 0 #2a1342,6px 6px 0 #1a0b2b,9px 9px 0 #2a1342,0 14px 20px rgba(0,0,0,.6)}
.monte-rot{display:flex;flex-direction:column;align-items:flex-start;font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--lilas)}
.monte-rot b{font-family:var(--cartoon);font-weight:400;font-size:28px;color:var(--branco);letter-spacing:0}
.monte.pode{cursor:pointer}
.monte.pode .pilha{animation:chama 1s ease-in-out infinite alternate}
.monte.pode .monte-rot{color:var(--ouro)}
@keyframes chama{from{transform:translateY(0) rotate(-2deg);filter:drop-shadow(0 0 0 rgba(247,181,44,0))}to{transform:translateY(-6px) rotate(2deg);filter:drop-shadow(0 0 16px rgba(247,181,44,.9))}}
.monte:disabled{opacity:.85}
.metas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.meta{background:var(--roxo-esc);border:2px solid #000;border-top:6px solid var(--c,#666);border-radius:14px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.meta b{font-family:var(--cartoon);font-weight:400;font-size:24px;line-height:1;color:var(--branco)}
.meta span{font-size:12px;font-weight:800;color:var(--lilas);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{font-size:11px;color:var(--ouro);font-weight:700}
.meta.vazia{opacity:.5}
.meta.coringa{--c:#1b161c;border-top-color:#8d8987}
.falta{margin:0;text-align:center;font-size:14px;color:var(--lilas)}
.falta b{color:var(--ouro)}
.mao{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.grupo-mao{background:rgba(26,11,43,.75);border:2px solid #000;border-radius:16px;padding:8px;border-top:6px solid var(--c);max-width:100%}
.grupo-rot{display:flex;align-items:center;gap:6px;font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0 2px 6px;color:var(--branco)}
.grupo-rot i{width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid #fff}
.grupo-rot b{margin-left:auto;background:var(--c);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;border:2px solid #000}
.grupo-cartas{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px}
.mini{--w:64px;position:relative;width:var(--w);padding:0;border:0;background:none;color:var(--branco);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .18s;border-radius:8px}
.mini img{width:100%;display:block;border-radius:7%/4.2%;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
.mini-nome{font-size:11px;font-weight:800;line-height:1.1;text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-num{position:absolute;top:-6px;right:-6px;background:var(--c);color:#fff;border:2px solid #000;border-radius:999px;font-size:11px;font-weight:900;padding:1px 6px}
.mini em{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--ouro);color:var(--tinta);font-style:normal;font-weight:900;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:2px solid var(--tinta);z-index:2}
.mini.nova img{box-shadow:0 0 0 3px var(--ouro),0 0 18px rgba(247,181,44,.8)}
.descartando .mini{cursor:pointer}
.descartando .mini:hover{transform:translateY(-4px)}
.mini.sel{transform:translateY(-12px)!important}
.mini.sel img{box-shadow:0 0 0 4px var(--nao),0 0 22px rgba(255,93,108,.8)}
.mini.sel .mini-nome{color:var(--nao)}
.acao-descarte{display:flex;justify-content:center}
.mini-tira{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);background:var(--nao);color:#fff;font-weight:900;font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:2px 5px;border-radius:999px;border:2px solid var(--tinta);white-space:nowrap;box-shadow:0 3px 0 var(--tinta)}
@media (min-width:1000px){.mini-tira{font-size:12px}}
.acao-descarte .botao:disabled{background:#8f84a3;box-shadow:0 6px 0 var(--tinta);cursor:default}
.gritar-box{display:flex;justify-content:center}
.botao.gritar{font-size:clamp(34px,6vw,56px);background:linear-gradient(#ffd35a,#f7a21b);animation:gritaPulsa .6s ease-in-out infinite alternate}
@keyframes gritaPulsa{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.07) rotate(2deg)}}
.sup-rel{--p:1;position:relative;width:76px;height:76px;flex:none;display:grid;place-items:center;align-content:center;transition:opacity .3s}
.sup-rel svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sup-rel circle{fill:none;stroke-width:5}
.sup-rel .trilho{stroke:rgba(255,255,255,.14);fill:rgba(26,11,43,.85)}
.sup-rel .arco{stroke:var(--ouro);stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:calc(119.4 * (1 - var(--p)));transition:stroke-dashoffset .1s linear,stroke .2s}
.sup-rel b{position:relative;font-family:var(--cartoon);font-weight:400;font-size:30px;line-height:1;color:var(--branco);font-variant-numeric:tabular-nums}
.sup-rel span{position:relative;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--lilas)}
.sup-rel.urgente .arco{stroke:var(--nao)}
.sup-rel.urgente b{color:var(--nao);animation:urge .5s ease-in-out infinite alternate}
@keyframes urge{to{transform:scale(1.18)}}
.sup-rel.parado{opacity:.35}
.sup-rel.parado .arco{stroke:var(--lilas)}
@media (max-width:420px){.sup-rel{width:64px;height:64px}.sup-rel b{font-size:24px}}
@media (min-width:1600px){.sup-rel{width:104px;height:104px}.sup-rel b{font-size:42px}}
.voando{position:fixed;z-index:40;pointer-events:none;transition:transform .6s cubic-bezier(.3,.7,.3,1),opacity .6s;border-radius:7%/4.2%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}
.fim.sup-fim{overflow:auto;place-items:start center;padding-block:130px 24px}
.sup-fim .caixa{max-width:560px}
.fim-grupos{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.fim-grupo{background:var(--roxo-esc);border:2px solid #000;border-left:8px solid var(--c);border-radius:12px;padding:6px 8px;text-align:left}
.fg-rot{display:block;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--branco);margin-bottom:4px}
.fim-grupo>div{display:flex;gap:6px;flex-wrap:wrap}
.fim-grupo .mini{--w:56px}
@media (max-width:420px){.mini{--w:56px}.monte .pilha{width:60px}.rival{padding:6px 10px 6px 6px}.rival .av{width:32px;height:32px}.rival .rn{font-size:17px}.meta b{font-size:20px}}
@media (min-width:1000px){.mini{--w:88px}.meta span{font-size:13px}.meta b{font-size:28px}.mini-nome{font-size:12px}.monte .pilha{width:96px}}
@media (min-width:1600px){.mini{--w:104px}.mini-nome{font-size:15px}.meta b{font-size:34px}.meta span{font-size:15px}.rival .rn{font-size:26px}.monte .pilha{width:120px}}
@media (prefers-reduced-motion:reduce){.monte.pode .pilha,.botao.gritar,.rival.ativo .av{animation:none}}
/* ---------- Fast ---------- */
#fast{--roxo-fundo:#1f1033;--roxo-carta:#2e1a4a;--roxo-linha:#4a3270;--ftexto:#f6f0ff;--laranja:#ff8a1f;--display:var(--cartoon);--corpo:var(--texto);color:var(--ftexto)}
#fast .app{padding-left:0;padding-right:0}
#fast .barra{margin-bottom:4px}
#fast .carta-box{position:relative;isolation:isolate}
#fast .carta-box::before{content:"";position:absolute;inset:-28% -55%;z-index:-1;pointer-events:none;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,214,90,.75) 0%,rgba(255,170,40,.38) 30%,rgba(255,140,20,.12) 52%,transparent 72%);
  filter:blur(8px);animation:fxbrilho 2.6s ease-in-out infinite alternate;transition:opacity .4s,transform .4s}
@keyframes fxbrilho{from{opacity:.75;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
#fast .carta-box.revelada::before{background:radial-gradient(ellipse at center,rgba(255,226,110,.8) 0%,rgba(255,180,40,.4) 35%,rgba(255,140,20,.12) 58%,transparent 75%)}
#fast .face{outline:2px solid rgba(255,214,90,.45);outline-offset:-1px;box-shadow:0 0 50px rgba(255,190,50,.45),0 22px 50px rgba(0,0,0,.7)!important}
#fast aside{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:rgba(46,26,74,.82)!important}
#fast .niveis,#fast .icone{backdrop-filter:blur(4px)}
#fast .app{max-width:1200px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:18px;min-height:100%}
#fast header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#fast .marca{font-family:var(--cartoon);font-size:clamp(28px,4vw,42px);letter-spacing:.04em;line-height:1;
  color:var(--ouro);-webkit-text-stroke:2px var(--tinta);paint-order:stroke fill;text-shadow:3px 3px 0 var(--tinta)}
#fast .marca span{color:var(--laranja);margin-left:.25em}
#fast .ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#fast .niveis{display:flex;background:var(--roxo-carta);border:2px solid var(--roxo-linha);border-radius:999px;padding:4px}
#fast .niveis button{font:700 15px var(--texto);color:var(--lilas);background:none;border:0;border-radius:999px;padding:6px 16px;cursor:pointer}
#fast .niveis button[aria-pressed="true"]{background:var(--ouro);color:var(--tinta)}
#fast .icone{font:700 14px var(--texto);color:var(--lilas);background:var(--roxo-carta);border:2px solid var(--roxo-linha);border-radius:999px;padding:7px 14px;cursor:pointer}
#fast button:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}

#fast .fpalco{display:grid;grid-template-columns:1fr 260px;gap:24px;flex:1;align-items:start}
@media (max-width:820px){#fast .fpalco{grid-template-columns:1fr}}
#fast .centro{display:flex;flex-direction:column;align-items:center;gap:20px;min-width:0}
#fast .chamada{font-family:var(--cartoon);font-size:clamp(30px,5vw,60px);letter-spacing:.03em;text-align:center;line-height:1;
  min-height:1.1em;color:var(--ftexto);text-shadow:3px 3px 0 var(--tinta);text-wrap:balance}
#fast .chamada.quente{color:var(--ouro);animation:fxpulsa .9s ease-in-out infinite alternate}
@keyframes fxpulsa{to{transform:scale(1.06)}}

#fast .carta-box{perspective:1400px;width:min(78vw,calc(58vh * .645),400px);aspect-ratio:480/797;max-width:100%}
#fast .carta{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
#fast .carta.virada{transform:rotateY(180deg)}
#fast .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:6%/3.9%;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.55)}
#fast .verso{background:center/cover no-repeat url("verso.webp")}
#fast .carta.tremendo .verso{animation:fxtreme .12s linear infinite}
@keyframes fxtreme{0%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}100%{transform:rotate(-1deg)}}
#fast .frente{transform:rotateY(180deg);background:var(--cor,#555);display:flex;flex-direction:column;justify-content:space-between;
  padding:9% 8%;border:6px solid rgba(255,255,255,.85);color:#fff}
#fast .carta-real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;max-width:none;display:block}
#fast .frente::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 14px,transparent 14px 28px);pointer-events:none}
#fast .topo{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative}
#fast .pos{font-family:var(--cartoon);font-size:clamp(26px,4.2vh,44px);line-height:.9;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
#fast .pos small{display:block;font:700 11px var(--texto);letter-spacing:.08em;text-transform:uppercase;opacity:.9}
#fast .selo{font:800 12px var(--texto);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.28)}
#fast .nome{position:relative;font-family:var(--cartoon);text-align:center;line-height:.95;letter-spacing:.02em;
  font-size:clamp(40px,var(--tam,9vh),110px);color:#fff;-webkit-text-stroke:2px rgba(0,0,0,.35);paint-order:stroke fill;
  text-shadow:4px 4px 0 rgba(0,0,0,.3);text-wrap:balance;overflow-wrap:normal;word-break:keep-all;hyphens:none;max-width:100%}
#fast .base{position:relative;text-align:center;font-weight:700;font-size:clamp(14px,2vh,19px);line-height:1.25}
#fast .base span{display:block;font-weight:500;opacity:.9}

#fast .acao{font-family:var(--cartoon);font-size:clamp(26px,3.6vw,40px);letter-spacing:.05em;color:var(--tinta);
  background:linear-gradient(180deg,#ffd84a,var(--laranja));border:3px solid var(--tinta);border-radius:18px;
  padding:12px 36px;cursor:pointer;box-shadow:0 6px 0 var(--tinta);transition:transform .08s}
#fast .acao:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tinta)}
#fast .dica-tecla{font-size:13px;color:var(--lilas);text-align:center}

#fast aside{background:var(--roxo-carta);border:2px solid var(--roxo-linha);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
#fast aside h2{margin:0;font-family:var(--cartoon);font-weight:400;font-size:24px;letter-spacing:.05em;color:var(--ouro)}
#fast .numeros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#fast .num{background:var(--roxo-fundo);border-radius:10px;padding:8px 10px}
#fast .num b{display:block;font-family:var(--cartoon);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
#fast .num small{font-size:12px;color:var(--lilas)}
#fast ol.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
#fast .hist li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
#fast .hist i{width:12px;height:12px;border-radius:3px;flex:none;background:var(--cor)}
#fast .hist em{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--lilas)}

/* ---------- Tela de abertura cinematográfica ---------- */
.abertura{position:fixed;inset:0;z-index:200;background:#2e1150;overflow:hidden;display:grid;place-items:center;cursor:pointer}
.ab-cena{position:absolute;inset:0;overflow:hidden}
.ab-cena::before{content:"";position:absolute;inset:-40px;background:url("arte/keyart.webp") center/cover;filter:blur(28px) brightness(.6) saturate(1.2)}
.ab-arte{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:62% 8%;transform-origin:60% 40%;
  animation:abZoom 9s cubic-bezier(.2,.6,.2,1) both,abAparece 1.4s ease both}
@keyframes abZoom{from{transform:scale(1.12)}to{transform:scale(.95)}}
@keyframes abAparece{from{filter:brightness(0) blur(8px)}to{filter:brightness(1) blur(0)}}
.ab-orbita{position:absolute;inset:0;perspective:900px;pointer-events:none}
.ab-orbita img.ab-frente{z-index:4;opacity:0;box-shadow:0 0 26px rgba(255,200,80,.6),0 18px 34px rgba(0,0,0,.55)}
.ab-orbita img{position:absolute;left:0;top:0;width:var(--w);border-radius:7%/4.2%;box-shadow:0 0 18px rgba(255,200,80,.55),0 10px 22px rgba(0,0,0,.6);will-change:transform,filter,opacity}
.ab-luz{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--lx,66%) var(--ly,42%),rgba(255,206,110,.35),transparent 38%);mix-blend-mode:screen;animation:abPulso 2.4s ease-in-out infinite alternate}
@keyframes abPulso{to{opacity:.55}}
.ab-faixa{position:absolute;left:0;right:0;height:9vh;background:#000;z-index:3;transition:transform 1.2s cubic-bezier(.6,0,.2,1)}
.ab-faixa.cima{top:0}.ab-faixa.baixo{bottom:0}
.abertura.pronta .ab-faixa.cima{transform:translateY(-100%)}.abertura.pronta .ab-faixa.baixo{transform:translateY(100%)}
.ab-texto{position:absolute;z-index:4;left:max(4vw,16px);top:50%;translate:0 -50%;width:min(33vw,460px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ab-logo{width:100%;filter:drop-shadow(0 14px 30px rgba(0,0,0,.7));opacity:0;transform:scale(2.4) rotate(-8deg)}
.abertura.logo .ab-logo{animation:abLogo .9s cubic-bezier(.2,1.5,.4,1) forwards,abFlutua 3s 1s ease-in-out infinite alternate}
@keyframes abLogo{60%{opacity:1}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes abFlutua{from{transform:translateY(0) rotate(0)}to{transform:translateY(-8px) rotate(1deg)}}
.ab-sub{margin:0;font-family:var(--cartoon);font-size:clamp(20px,2.6vw,32px);color:#fff;-webkit-text-stroke:.11em var(--tinta);paint-order:stroke fill;opacity:0;transition:opacity .6s .3s}
.ab-btn{font-size:clamp(22px,2.6vw,32px);opacity:0;transform:translateY(20px);transition:.5s .6s}
.abertura.logo .ab-sub{opacity:1}.abertura.logo .ab-btn{opacity:1;transform:none;animation:abBtn 1.1s 1.4s ease-in-out infinite alternate}

.ab-omdo{width:58px;opacity:0;transition:opacity .6s 1s}.abertura.logo .ab-omdo{opacity:1}
.abertura.saindo{animation:abSai .8s cubic-bezier(.6,0,.4,1) forwards;pointer-events:none}

  .ab-cena::before{background:#2e1150;filter:none}

}

<script>
/* ================= Motor do jogo (sem tela) ================= */
const GRUPOS={pent:["Pentateuco","#554099"],hist:["Históricos","#2783b9"],poet:["Poéticos","#288c4b"],prof:["Proféticos","#a92e28"],
  evan:["Evangelhos","#c03197"],atos:["Histórico","#1b161c"],cart:["Cartas","#e89a2a"],apoc:["Apocalipse","#8d8987"]};
const MODOS={
  mega:{nome:"Mega",q:"A Bíblia toda · 66 cartas",d:"Gênesis e Apocalipse são as cartas Biblikaboom.",filtro:()=>true,bkb:["Gênesis","Apocalipse"],cor:"linear-gradient(90deg,#f0b440 50%,#682c84 50%)"},
  origem:{nome:"Origem",q:"Antigo Testamento · 39 cartas",d:"Gênesis é a carta Biblikaboom.",filtro:c=>c.t==="AT",bkb:["Gênesis"],cor:"#f0b440"},
  revelacao:{nome:"Revelação",q:"Novo Testamento · 27 cartas",d:"Apocalipse é a carta Biblikaboom.",filtro:c=>c.t==="NT",bkb:["Apocalipse"],cor:"#682c84"}
};
const ATRIBUTOS=[
  {k:"cap",r:"Capítulos"},{k:"ver",r:"Versículos"},{k:"p",r:"Posição na Bíblia",menor:true},{k:"let",r:"Letras no título"},{k:"cur",r:"Números Curiosos"}
];
const ATR=Object.fromEntries(ATRIBUTOS.map(a=>[a.k,a]));
function embaralhar(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function comparar(a,b,k){ // 1: a vence, -1: b vence, 0: empate
  const va=a[k],vb=b[k];if(va===vb)return 0;
  return ATR[k].menor?(va<vb?1:-1):(va>vb?1:-1);
}
function novoJogo(modo,nivel){
  const cartas=embaralhar(CARTAS.filter(MODOS[modo].filtro));
  const J={modo,nivel,P:[],R:[],vez:Math.random()<.5?"P":"R",pote:[],usado:{P:new Set(),R:new Set()},rodada:0,cartas};
  cartas.forEach((c,i)=>(i%2?J.R:J.P).push(c));
  return J;
}
function ehBkb(J,c){return MODOS[J.modo].bkb.includes(c.n)}
function resolver(J,k){ // compara as cartas do topo
  const cp=J.P[0],cr=J.R[0];const base=comparar(cp,cr,k);
  const pPode=ehBkb(J,cp)&&!J.usado.P.has(cp.n),rPode=ehBkb(J,cr)&&!J.usado.R.has(cr.n);
  let pUsa=pPode&&base<=0,rUsa=rPode&&(base>=0||pUsa);
  if(rUsa&&!pUsa&&pPode)pUsa=true;
  if(pUsa)J.usado.P.add(cp.n);if(rUsa)J.usado.R.add(cr.n);
  const res=pUsa&&rUsa?0:pUsa?1:rUsa?-1:base;
  return {res,pUsa,rUsa,base,cp,cr,k};
}
function recolher(J,res){ // tira as cartas do topo para o pote; devolve quem leva (ou null se empate)
  J.pote.push(J.P.shift(),J.R.shift());J.rodada++;
  if(res===0)return null;
  const quem=res===1?"P":"R";J[quem].push(...J.pote);J.pote=[];J.vez=quem;return quem;
}
function desempatar(J){ // próxima carta de cada um: menor posição leva tudo
  if(!J.P.length||!J.R.length){const q=J.P.length?"P":"R";J[q].push(...J.pote);J.pote=[];J.vez=q;return {quem:q,dp:null,dr:null}}
  const dp=J.P.shift(),dr=J.R.shift();J.pote.push(dp,dr);
  const q=dp.p<dr.p?"P":"R";J[q].push(...J.pote);J.pote=[];J.vez=q;return {quem:q,dp,dr};
}
const FORCA={};
function forca(c,k,lista){
  const id=c.n+k+lista.length;if(id in FORCA)return FORCA[id];
  let v=0;for(const o of lista){const r=comparar(c,o,k);v+=r>0?1:r===0?.5:0}
  return FORCA[id]=v/lista.length;
}
function roboEscolhe(J){
  const c=J.R[0],todos=ATRIBUTOS.map(a=>a.k);
  const melhor=todos.slice().sort((a,b)=>forca(c,b,J.cartas)-forca(c,a,J.cartas))[0];
  const aleat=todos[Math.floor(Math.random()*todos.length)];
  if(J.nivel==="facil")return Math.random()<.25?melhor:aleat;
  if(J.nivel==="medio")return Math.random()<.65?melhor:aleat;
  return melhor;
}
function fimPorTempo(J){
  if(J.P.length!==J.R.length)return J.P.length>J.R.length?"P":"R";
  const monte=embaralhar([...J.P,...J.R]);return monte[0].p<monte[1].p?"P":"R";
}

  }

    if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=tipo;o.frequency.setValueAtTime(f,t);o.detune.value=det;
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);

    s.connect(fl);fl.connect(g);g.connect(bus);s.start(t,Math.random()*.5);s.stop(t+dur+.05);

  const N=n=>440*Math.pow(2,(n-69)/12);
  const fx={

    boom(){const t=t0();tom(140,{t,dur:.7,tipo:"sine",vol:.55,f2:38});ruido({t,dur:.9,vol:.5,tipo:"lowpass",f:2400,f2:180,q:.7});

/* ================= Supremo: motor ================= */
const SUP_TIPOS=["pent","hist","poet","prof","evan","cart"];
const SUP_TOTAL={pent:5,hist:12,poet:5,prof:17,evan:4,cart:21};
let PAR_LIM=40,PAR_P=.15;
const SUP_ROBOS=["Robô Josué","Robô Débora","Robô Samuel"];
const ehCoringa=c=>c.g==="atos"||c.g==="apoc";
const numDe=c=>parseInt(c.s,10)||0;
function supNovo(nRobos,avancado,nivel){
  const baralho=embaralhar(CARTAS.slice());const riv=typeof sortearRivais==="function"?sortearRivais(nRobos):SUP_ROBOS.slice(0,nRobos).map((n,a)=>({n,a}));
  const S={avancado,nivel,parado:[0,0,0,0],melhor:[0,0,0,0],maos:[],monte:[],vez:0,jogadas:0,nomes:["Você"].concat(riv.map(r=>r.n)),av:[null].concat(riv.map(r=>r.a)),fase:"comprar",nova:null,vencedor:null};
  for(let j=0;j<=nRobos;j++)S.maos.push(baralho.splice(0,12));
  S.monte=baralho;return S;
}
/* Verifica se a mão de 12 cartas fecha 3 grupos de 4 de tipos diferentes. Devolve os grupos ou null. */
function supGrupos(mao,avancado){
  if(mao.length!==12)return null;
  const cor=mao.filter(ehCoringa),por={};
  for(const c of mao)if(!ehCoringa(c))(por[c.g]=por[c.g]||[]).push(c);
  const tipos=Object.keys(por);
  if(tipos.length!==3)return null;
  let precisa=0;
  for(const t of tipos){
    const cs=por[t];if(cs.length>4)return null;
    if(avancado){const ns=cs.map(numDe).sort((a,b)=>a-b);
      if(new Set(ns).size!==ns.length)return null;
      if(ns[ns.length-1]-ns[0]>3)return null;}
    precisa+=4-cs.length;
  }
  if(precisa!==cor.length)return null;
  const restam=cor.slice();
  return tipos.map(t=>({tipo:t,cartas:por[t].slice().sort((a,b)=>numDe(a)-numDe(b)),coringas:restam.splice(0,4-por[t].length)}));
}
/* Melhor janela de um tipo: quantas cartas úteis (até 4) e quais números ela cobre */
function supJanela(cs,t,avancado){
  if(!cs.length)return {n:0,ini:0};
  if(!avancado)return {n:Math.min(4,cs.length),ini:0};
  const ns=[...new Set(cs.map(numDe))];let best={n:0,ini:1},tot=SUP_TOTAL[t];
  for(let i=1;i<=Math.max(1,tot-3);i++){const d=ns.filter(n=>n>=i&&n<=i+3).length;if(d>best.n)best={n:d,ini:i}}
  return best;
}
/* Planejamento: os 3 tipos-alvo e quanto falta */
function supPlano(mao,avancado){
  const por={};for(const c of mao)if(!ehCoringa(c))(por[c.g]=por[c.g]||[]).push(c);
  const cor=mao.filter(ehCoringa).length;
  const tipos=SUP_TIPOS.map(t=>{const cs=por[t]||[];const j=supJanela(cs,t,avancado);
    return {tipo:t,cartas:cs,n:j.n,ini:j.ini,extra:Math.min(SUP_TOTAL[t],4)/100+(cs.length-j.n)*-.001}}).sort((a,b)=>b.n+b.extra-(a.n+a.extra));
  const alvo=tipos.slice(0,3).filter(x=>x.n>0);
  const soma=alvo.reduce((s,x)=>s+x.n,0);
  return {alvo,cor,soma,falta:Math.max(0,12-soma-cor),por};
}
function supPontos(mao,avancado){
  const p=supPlano(mao,avancado);
  const usados=Math.min(12,p.soma+p.cor);
  // bônus: 4º tipo de reserva vale um pouco
  return usados+p.alvo.reduce((s,x)=>s+x.extra,0);
}
/* Robô: com 13 cartas, descarta a que deixa a melhor mão */
function supRoboDescarte(mao,avancado,nivel,parado=0){
  const naoCor=mao.filter(c=>!ehCoringa(c));
  const sorte=()=>naoCor[Math.floor(Math.random()*naoCor.length)];
  if(nivel==="facil"&&Math.random()<.5)return sorte();
  if(nivel==="medio"&&Math.random()<.22)return sorte();
  /* empacou: troca de plano soltando uma carta do grupo mais fraco */
  if(parado>PAR_LIM&&Math.random()<PAR_P){const p=supPlano(mao,avancado);const fraco=p.alvo[p.alvo.length-1];
    if(fraco&&fraco.cartas.length&&!supGrupos(mao.filter(x=>x!==fraco.cartas[0]),avancado))return fraco.cartas[Math.floor(Math.random()*fraco.cartas.length)]}
  let melhor=[],mv=-1e9;
  for(const c of mao){
    if(ehCoringa(c))continue;
    const resto=mao.filter(x=>x!==c);
    let v=supPontos(resto,avancado);
    if(supGrupos(resto,avancado))v+=100;
    if(v>mv+1e-9){mv=v;melhor=[c]}else if(Math.abs(v-mv)<1e-9)melhor.push(c);
  }
  return melhor[Math.floor(Math.random()*melhor.length)]||naoCor[0];
}

function supRelogioParar(){if(supTimer)clearInterval(supTimer);supTimer=null;const r=$("#sup-rel");if(r)r.classList.add("parado")}
function supRelogioTick(){
  if(F!=="sup"||!SP||SP.vez!==0||(SP.fase!=="comprar"&&SP.fase!=="descartar")){supRelogioParar();return}
  const agora=performance.now();if(document.querySelector(".confirma")){supFimEm+=agora-(supUltTick||agora);supUltTick=agora;return}supUltTick=agora;
  const total=SUP_SEG()*1000,rest=Math.max(0,supFimEm-performance.now()),seg=Math.ceil(rest/1000);

}

/* Ordem da mão: cada coringa fica junto do grupo que ele ajuda a fechar (no Avançado, no buraco da sequência) */
function supOrdemMao(mao,avancado){
  const pl=supPlano(mao.filter(c=>c!==SUPSEL||mao.length<13),avancado),cor=mao.filter(ehCoringa),pos=new Map();
  const vagas=[];
  pl.alvo.forEach(a=>{
    if(avancado){const tem=new Set(a.cartas.map(numDe));for(let n=a.ini;n<=a.ini+3;n++)if(!tem.has(n))vagas.push({tipo:a.tipo,num:n,falta:4-a.n})}
    else for(let k=a.n;k<4;k++)vagas.push({tipo:a.tipo,num:99+k,falta:4-a.n});
  });
  vagas.sort((x,y)=>x.falta-y.falta);
  cor.forEach((c,i)=>{const v=vagas[i];pos.set(c,v?{g:v.tipo,n:v.num-.5}:{g:"apoc",n:99})});
  const chave=c=>pos.has(c)?pos.get(c):{g:c.g,n:numDe(c)};
  return {ordem:mao.slice().sort((a,b)=>{const A=chave(a),B=chave(b);return SUP_ORDEM.indexOf(A.g)-SUP_ORDEM.indexOf(B.g)||A.n-B.n||a.p-b.p}),pos};
}
function atualizarMao(){

  for(const [p,el] of maoEls)if(!mao.find(c=>c.p===p)){el.remove();maoEls.delete(p)}
  const W=box.clientWidth,cw=cartaW();box.style.setProperty("--cw",cw+"px");box.style.height=Math.round(cw*1.62+((n-1)/2)**2*Math.min(2.2,cw*.022)+30)+"px";
  const step=n>1?Math.min(cw*.78,(W-cw*1.5)/(n-1+2.4*.3)):0,ang=Math.min(4.2,46/Math.max(n,1)),k=Math.min(2.2,cw*.022);
  const gk=c=>{const d=om.pos.get(c);return d?d.g:c.g};let gaps=0;const gb=mao.map((c,i)=>{if(i&&gk(c)!==gk(mao[i-1]))gaps++;return gaps});
  const gw=Math.min(step*.6,cw*.3),larg=step*(n-1)+gaps*gw;
  mao.forEach((c,i)=>{
    let el=maoEls.get(c.p);
    if(!el){el=document.createElement("button");el.type="button";el.className="scarta";el.dataset.supc=c.p;el.style.setProperty("--c",corTipo(c.g));
      el.innerHTML=`<img src="${img(c)}" alt=""><span class="sc-nome">${c.n}</span>${S.avancado&&!ehCoringa(c)?`<span class="sc-num">${c.s}</span>`:""}`;
      el.style.setProperty("--i",i);box.appendChild(el);maoEls.set(c.p,el)}
    const off=i-(n-1)/2,sel=SUPSEL===c,nova=S.nova===c;
    if(ehCoringa(c)){const dest=om.pos.get(c),g=dest&&dest.g!=="apoc"?dest.g:null;el.classList.toggle("coringa-de",!!g);el.style.setProperty("--c",g?corTipo(g):corTipo(c.g));
      el.querySelector(".sc-nome").textContent=g?c.n+" · coringa de "+GRUPOS[g][0]:c.n;}
    const yMax=((n-1)/2)**2*k,x=i*step+gb[i]*gw-larg/2,y=off*off*k-yMax,rot=off*ang;
    el.style.transform=sel?`translate(${x}px,${y-cw*.42}px) rotate(${rot*.4}deg) scale(1.14)`:`translate(${x}px,${y}px) rotate(${rot}deg)`;

  });

/* animação: carta voando entre dois pontos, em arco */
function voar(de,para,src,{virada=true}={}){
  if(calmo||!de||!para)return;
  const a=de.getBoundingClientRect(),b=para.getBoundingClientRect();
  const el=document.createElement("img");el.src=virada?"verso.webp":src;el.className="voando";
  const w=Math.min(Math.max(a.width*.6,56),96),h=w*1.62;el.style.cssText=`left:${a.left+a.width/2-w/2}px;top:${a.top+a.height/2-h/2}px;width:${w}px`;
  document.body.appendChild(el);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2),r=Math.random()*40-20;
  const an=el.animate([{transform:"translate(0,0) rotate(0) scale(1)",opacity:1},
    {transform:`translate(${dx*.5}px,${dy*.5-Math.min(120,Math.abs(dx)*.25+40)}px) rotate(${r}deg) scale(1.15)`,opacity:1,offset:.5},
    {transform:`translate(${dx}px,${dy}px) rotate(${r*2}deg) scale(.85)`,opacity:.85}],{duration:560,easing:"cubic-bezier(.3,.6,.3,1)"});
  an.onfinish=()=>el.remove();
}

/* Confete: explosão de papeizinhos coloridos */
function confete(cv,qtd){
  if(!cv)return;const dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext("2d");c.scale(dpr,dpr);
  const cores=["#ffc21a","#ff8a1f","#e8327c","#2b8fe0","#2fa35a","#ffffff","#c8b5ee"];
  const ps=[];const ox=W/2,oy=H*.22;
  for(let i=0;i<qtd;i++){const a=Math.random()*Math.PI*2,v=6+Math.random()*12;
    ps.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,cor:cores[i%cores.length],vida:0})}
  for(let i=0;i<qtd/2;i++){const lado=i%2?W*.05:W*.95,a=(i%2?-1:-2.1)+Math.random()*.6,v=10+Math.random()*10;
    ps.push({x:lado,y:H,vx:Math.cos(a)*v*(i%2?1:1),vy:Math.sin(a)*v-4,w:6+Math.random()*8,h:4+Math.random()*6,r:0,vr:(Math.random()-.5)*.5,cor:cores[(i+3)%cores.length],vida:0})}
  let t0=performance.now();
  (function passo(t){
    const dt=Math.min(2,(t-t0)/16.7);t0=t;c.clearRect(0,0,W,H);let vivos=0;
    for(const p of ps){p.vida+=dt;p.vy+=.28*dt;p.vx*=.992;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
      if(p.y<H+20){vivos++;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.scale(1,Math.cos(p.vida*.2));c.fillStyle=p.cor;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()}}
    if(vivos&&cv.isConnected)requestAnimationFrame(passo);else c.clearRect(0,0,W,H);
  })(t0);
}

function topoPilha(){const ims=[...$("fpilha").querySelectorAll("img:not([hidden])")];return ims[ims.length-1]}
function deltaPilha(){
  const box=$("cbox"),t=topoPilha();box.style.transform="none";
  const a=box.getBoundingClientRect(),b=t.getBoundingClientRect();
  return {x:(b.left+b.width/2)-(a.left+a.width/2),y:(b.top+b.height/2)-(a.top+a.height/2),s:b.width/a.width};
}
function saltar(depois){
  const box=$("cbox"),d=deltaPilha();

    {transform:`translate(${d.x*.35}px,${-90}px) scale(${.75+d.s*.3}) rotate(10deg)`,offset:.55},

  return S;

function soEstadoDe(S,extra={}){
  const n=S.maos.length,maos=Array(n);S.maos.forEach((m,i)=>maos[soAbs(i)]=m.map(c=>c.p));
  return Object.assign({maos,monte:S.monte.map(c=>c.p),vez:soAbs(S.vez),fase:S.fase,jogadas:S.jogadas,desdeEmb:S.desdeEmb||0,nova:S.nova?S.nova.p:null,t:Date.now()},extra);
}
